plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
}

// Three jars: `common` (the shared protocol) is bundled inside both `server` (the mod for hosting, installed on the
// server only) and `client` (the optional companion, installed on the player's client only).
subprojects {
    apply plugin: 'net.fabricmc.fabric-loom'

    version = rootProject.mod_version
    group = rootProject.maven_group

    base {
        archivesName = "${rootProject.archives_base_name}-${project.name}"
    }

    repositories {
        // Fabric Permissions API
        mavenCentral()
        // Placeholder API
        maven {
            name = 'Nucleoid'
            url = 'https://maven.nucleoid.xyz'
        }
    }

    dependencies {
        // To change the versions see the gradle.properties file
        minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
        implementation "net.fabricmc:fabric-loader:${rootProject.loader_version}"
        implementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_version}"
    }

    processResources {
        inputs.property "version", project.version
        inputs.property "minecraft_version", rootProject.minecraft_version
        inputs.property "loader_version", rootProject.loader_version
        filteringCharset "UTF-8"

        filesMatching("fabric.mod.json") {
            expand "version": project.version,
                    "minecraft_version": rootProject.minecraft_version,
                    "loader_version": rootProject.loader_version
        }
    }

    def targetJavaVersion = 25
    tasks.withType(JavaCompile).configureEach {
        // ensure that the encoding is set to UTF-8, no matter what the system default is
        it.options.encoding = "UTF-8"
        it.options.release.set(targetJavaVersion)
    }

    java {
        def javaVersion = JavaVersion.toVersion(targetJavaVersion)
        if (JavaVersion.current() < javaVersion) {
            toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
        }
        withSourcesJar()
    }

    jar {
        from(rootProject.file("LICENSE.txt")) {
            rename { "${it}_${rootProject.archives_base_name}" }
        }
    }
}
